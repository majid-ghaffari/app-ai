name: Delete App AI Preview

# Deleting a preview-<name> tag removes its preview registry entry, then deletes the Cloudflare
# Worker Preview <name>, with its Durable Object namespace and storage, only by an ID
# preview-deploy.yml recorded when it created that Preview. The token reaches only that step,
# which installs nothing; checkout and setup run with no credential.

on:
  delete: {}

concurrency:
  group: preview-${{ github.event.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  teardown:
    if: github.event.ref_type == 'tag' && startsWith(github.event.ref, 'preview-')
    runs-on: ubuntu-latest
    steps:
      - name: Parse deleted tag
        id: tag
        env:
          DELETED_TAG: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          TAG="${DELETED_TAG}"
          if [[ ! "$TAG" =~ ^preview-([a-z0-9][a-z0-9-]{0,40})$ ]]; then
            echo "Tag '$TAG' does not match preview-<name>; refusing to touch Cloudflare." >&2
            exit 1
          fi
          NAME="${BASH_REMATCH[1]}"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tearing down app-ai preview '$NAME'"
      - name: Unregister from preview registry
        env:
          PREVIEW_REGISTRY_URL: ${{ vars.PREVIEW_REGISTRY_URL }}
          PREVIEW_ADMIN_SECRET: ${{ secrets.PREVIEW_ADMIN_SECRET }}
          PREVIEW_NAME: ${{ steps.tag.outputs.name }}
        run: |
          set -uo pipefail
          if [ -z "$PREVIEW_REGISTRY_URL" ] || [ -z "$PREVIEW_ADMIN_SECRET" ]; then
            echo "Repo variable PREVIEW_REGISTRY_URL and secret PREVIEW_ADMIN_SECRET must both be set." >&2; exit 1
          fi
          # The extension stops listing the Preview first, whatever happens to it below. A failure
          # leaves the job red to re-run; every step of this job is idempotent.
          code=$(curl -sS --max-time 15 -o "$RUNNER_TEMP/unreg.txt" -w '%{http_code}' -X DELETE \
            -H "Authorization: Bearer $PREVIEW_ADMIN_SECRET" \
            "$PREVIEW_REGISTRY_URL/previews/app-ai/$PREVIEW_NAME" || echo "000")
          body="$(cat "$RUNNER_TEMP/unreg.txt" 2>/dev/null || true)"
          ok=$(echo "$body" | jq -r '.ok // empty' 2>/dev/null || true)
          if [ "$code" != "200" ] || [ "$ok" != "true" ]; then
            echo "Unregister failed: http=$code body=$body. Re-run this job once the registry accepts module app-ai." >&2
            exit 1
          fi
          echo "Unregistered from preview registry"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Delete the owned Worker Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_API_BASE_URL: https://api.cloudflare.com/client/v4
          PREVIEW_REGISTRY_KV_NAMESPACE_ID: ${{ vars.PREVIEW_REGISTRY_KV_NAMESPACE_ID }}
          PREVIEW_NAME: ${{ steps.tag.outputs.name }}
          PREVIEW_TAG: ${{ steps.tag.outputs.tag }}
        # Reads the Preview by exact name and deletes its ID only when that ID and the Preview's
        # creation time are recorded in the verified preview-registry namespace; anything else
        # refuses with no delete.
        run: node scripts/preview-ownership.mjs delete --name "$PREVIEW_NAME" --tag "$PREVIEW_TAG"
