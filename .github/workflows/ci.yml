name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format-check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      - name: Check out the workspace standards
        uses: actions/checkout@v4
        with:
          repository: limespot/root
          ssh-key: ${{ secrets.LIMESPOT_ROOT_DEPLOY_KEY }}
          path: limespot-root
          sparse-checkout: |
            _standards
            _enforcement
          persist-credentials: false

      - name: Published DPA lists every AI provider
        id: published-dpa
        env:
          LIMESPOT_ROOT_STANDARDS: ${{ github.workspace }}/limespot-root/_standards
          PUBLISHED_DPA_URL: https://limespot.com/legal/dpa
        run: |
          revision="$(git -C limespot-root rev-parse HEAD)"
          echo "limespot/root revision: ${revision}"
          python3 limespot-root/_enforcement/check-published-dpa.py

      - name: Test
        if: ${{ !cancelled() && (success() || steps.published-dpa.outcome == 'failure') }}
        env:
          LIMESPOT_ROOT_STANDARDS: ${{ github.workspace }}/limespot-root/_standards
        run: npx vitest run

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - name: Install dependencies
        run: npm ci

      # Builds the worker bundle without deploying — verifies imports and the
      # wrangler [[rules]] Text rule resolve. The repository launcher stamps
      # the exact checked-out SHA even for dry runs. Needs no Cloudflare credentials.
      - name: Bundle (dry run)
        run: npm run deploy:dry-run

  build:
    if: ${{ always() }}
    needs: [lint, format, typecheck, test, package]
    runs-on: ubuntu-latest
    steps:
      - name: Require every gate
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
