name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format-check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npx vitest run

      # Builds the worker bundle without deploying — verifies imports and the
      # wrangler [[rules]] Text rule resolve. Needs no Cloudflare credentials.
      - name: Bundle (dry run)
        run: npx wrangler deploy --dry-run
