# Cloudflare Workers configuration
# Documentation: https://developers.cloudflare.com/workers/wrangler/configuration/
#
# Configuration channels (docs/CODE-PATTERNS.md → "No Hardcoded Config Values"):
#   • Production non-secrets → [vars] below (Cloudflare auto-deploys from main
#     with this file, so [vars] IS the production configuration).
#   • Production secrets     → Cloudflare Dashboard encrypted secrets
#     (provider API keys / TOKEN_ENCRYPTION_SECRET — never in this file).
#   • Local dev              → .dev.vars (gitignored; overrides [vars] under
#     `wrangler dev`). Every knob is documented in .dev.vars.example.
# The worker reads all of these ONLY through the typed accessors in
# src/config.ts — a missing variable throws, naming the variable and the
# channel to set it in. No fallback defaults exist anywhere.

name = "app-ai"
main = "src/index.ts"
compatibility_date = "2024-11-27"
# Compatibility flags for latest Workers runtime features (none needed yet).
# Must be a top-level key — placing it under a [table] mis-parses as that table's field.
compatibility_flags = []

# Account ID
account_id = "771ea33ba0e0d2d42b93212bd535509d"

# Worker limits
[limits]
cpu_ms = 50000

# Local development server settings
[dev]
ip = "127.0.0.1"
port = 8787
local_protocol = "http"

# Production variables (used by Cloudflare auto-deploy from GitHub).
# Workers Builds keeps its deploy commands in Dashboard → app-ai → Settings → Build;
# Wrangler configuration cannot encode those settings. Required commands:
#   Build command:                        (blank)
#   Deploy command:                       npm run deploy
#   Non-production branch deploy command: npm run deploy:preview
# Both repository launchers inject the exact Git revision consumed by /health.
#
# [vars] below is grouped by the same concerns, in the same order, as
# .dev.vars.example: worker identity, model routing, one section per provider,
# the scoped audit, and logging. Production SECRETS are set via the Cloudflare
# Dashboard (encrypted secrets), never in this file, and belong to those same
# sections:
#
#   Providers — one key per provider, read only by that provider's wire adapter:
#     CLAUDE_API_KEY  — the Anthropic API key (src/inference/adapters/anthropic-wire.ts).
#     OPENAI_API_KEY  — the OpenAI API key, required only while a resolved route uses OpenAI.
#     MOONSHOT_API_KEY — the metered Moonshot platform key, required only while a resolved
#       route uses Moonshot.
#     KIMI_API_KEY    — the Kimi Code subscription key, required only while a resolved route
#       uses Kimi Code. A separate account from MOONSHOT_API_KEY, not interchangeable.
#     GEMINI_API_KEY  — the Google Gemini API key, required only while a resolved route uses Gemini.
#
#   Sealed tokens and service credentials:
#     TOKEN_ENCRYPTION_SECRET — 32 random bytes encoded as base64. An HKDF root, not a
#       cipher key used directly: AES-GCM and HMAC subkeys derived from it seal opaque
#       file references, seal inference continuations, and key the tenant pseudonym that
#       scopes both. Rotation invalidates references (<=15 days) and continuations (<=24 hours).
#     PERSONALIZER_INTEGRATION_BRIDGE_TOKEN — the platform toolsets' caller-auth
#       token toward Personalizer's integration bridge (sent as
#       X-Personalizer-Integration-Bridge-Token, src/toolsets/integration-bridge.ts);
#       pairs with the PERSONALIZER_API_URL [vars] value below. Never logged.
#       Rotation: Personalizer accepts two active tokens per caller (current +
#       next), so flip this secret after Personalizer has the next value.
#
#   Studio audit:
#     AUDIT_ACTIVATION_SIGNING_SECRET — shared only with the limespot.com activation issuer.
#     AUDIT_SESSION_SIGNING_SECRET — app-ai-only key for exchanged audit sessions.
#     AUDIT_STATUS_SIGNING_SECRET — shared only with the limespot.com audit-status receiver.
#     GRADER_CHAT_ALERT_SLACK_WEBHOOK_URL — optional Slack incoming webhook the daily Grader chat
#       volume alert is posted to; without it the alert is only logged. Never logged itself.
#
#   Logging:
#     LOG_SEQ_API_KEY — optional Seq ingestion key. Anonymous ingestion is supported
#       by the configured endpoint; set this secret when the endpoint requires one.
[vars]
# ── Worker identity ──
ENVIRONMENT = "production"
PERSONALIZER_API_URL = "https://personalizer.io"
# Dev origins allowed to send credentialed CORS requests (comma-separated).
# Every other Origin is echoed WITHOUT credentials — see src/lib/cors.ts.
CREDENTIALED_ORIGINS = "https://local-app.limespot.com,http://localhost:4200,http://localhost:3000"
# The subscriber Personalizer reports for the master account. Only that
# subscriber may read GET /prompts; every other validated merchant is answered
# as though the route did not exist.
MASTER_SUBSCRIBER_ID = "1"
# A /messages request whose JSON body carries responseMode "keep-alive" is answered 200 at once,
# with a whitespace byte this often while the model works, then its outcome in a JSON envelope
# (src/lib/keep-alive-response.ts). Networks that drop a request receiving no reply bytes cut at
# 60 seconds, so the interval stays well under that.
MESSAGES_KEEP_ALIVE_INTERVAL_MILLISECONDS = "15000"

# ── Model routing ──
# CAPABILITY TIERS bound to concrete models. Each prompt group declares a tier;
# the model id set here decides which provider serves it, over which API family,
# with which capabilities and direct-file policy, through the family/explicit-id
# catalog in src/inference/model-catalog.ts. Pointing a tier at another
# provider's model is therefore a settings change — the catalog must know the
# model's family, and the resolved capabilities must satisfy every group on the
# tier, or the route fails before any provider call.
#   MODEL_FAST     — latency-sensitive / cheapest one-shot prompts.
#   MODEL_BALANCED — the multi-modal / JSON reasoners.
#   MODEL_FRONTIER — the most-capable flagship (the DEFAULT tier).
MODEL_FAST = "claude-haiku-4-5"
MODEL_BALANCED = "claude-sonnet-5"
MODEL_FRONTIER = "claude-opus-4-8"
# Sparse per-prompt exceptions to the tier bindings above, as a comma-separated
# promptGroupOrPromptName=modelId list — for example
# "website-analysis-visual=claude-opus-4-8,probe-style=claude-sonnet-5". A prompt
# name beats its group, and a group beats its tier binding. Empty means every
# prompt follows its tier. A key naming no registered prompt or prompt group
# throws rather than being ignored.
MODEL_OVERRIDES = "free-render-verification=@cf/qwen/qwen3.8-27b"
FREE_VISUAL_VERIFY_ENABLED = "true"
FREE_VISUAL_VERIFY_DAILY_LIMIT = "8"
FREE_VISUAL_VERIFY_ACCEPTANCE_RESERVE = "4"
INFERENCE_QUOTA_INTERNAL_ORIGIN = "https://inference-quota.internal"

# ── Anthropic ──
ANTHROPIC_API_BASE = "https://api.anthropic.com"

# ── OpenAI ──
OPENAI_API_BASE = "https://api.openai.com"

# ── Moonshot (metered platform account) ──
MOONSHOT_API_BASE = "https://api.moonshot.ai"

# ── Kimi Code (subscription account) ──
# A different origin and credential from the metered Moonshot account above; the
# adapter appends /v1/chat/completions, so no trailing slash.
KIMI_API_BASE = "https://api.kimi.com/coding"
KIMI_EVIDENCE_MAX_BYTES = "8000000"
KIMI_EVIDENCE_MAX_TOTAL_BYTES = "64000000"
KIMI_EVIDENCE_MAX_TEXT_BYTES = "16000000"

# ── Gemini ──
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta"

# ── Studio audit (scoped extension sessions) ──
# Origins a website-signed activation may name in its statusCallbackUrl claim.
# The website signs the exact callback path into the token; this list is the set
# of hosts app-ai will deliver a status event to.
AUDIT_STATUS_ORIGINS = "https://limespot.com"
# A session, and the Grader chat with it, lasts 30 days. A new activation for the same audit
# supersedes the active session, so a visitor who lost theirs reopens from a fresh link.
AUDIT_SESSION_TTL_SECONDS = "2592000"
# A session runs the Grader at most AUDIT_MAX_RUNS times: its first run and the
# retries Studio offers. One abuse ceiling is derived from the grader plan
# (src/lib/audit-plan.ts) times AUDIT_RUN_HEADROOM: each run's inference
# requests are held to it, and the session's uploads to AUDIT_MAX_RUNS runs of
# it; the conductor's own attempts never approach it. The byte limits bound one upload and one
# inference request and match the extension's own transport limits.
AUDIT_MAX_RUNS = "4"
AUDIT_RUN_HEADROOM = "2"
AUDIT_MAX_UPLOAD_BYTES = "8000000"
AUDIT_MAX_MESSAGE_BYTES = "1000000"

# ── Grader chat (an audit session's sales chat about its own report) ──
# On by default; GRADER_CHAT_ENABLED = "false" switches it off. Only a client declaring plan version 2
# is offered it, so a published extension that sends plan 1 or no plan gets no chat. An audit is answered at most
# GRADER_CHAT_MESSAGES_PER_AUDIT messages across all of its runs and sessions (plan version 2 holds it
# at 50 or fewer; neither a retry nor a reopened link restores one); one hashed visitor network address and the whole deployment are
# held to daily counts, and the deployment count raises an alert at every GRADER_CHAT_ALERT_EVERY
# messages. The model is the grader-sales group's balanced tier, or MODEL_OVERRIDES
# "grader-chat=<model>"; the effort applies only on a model that reasons.
GRADER_CHAT_ENABLED = "true"
GRADER_CHAT_MESSAGES_PER_AUDIT = "25"
GRADER_CHAT_MESSAGES_PER_VISITOR_PER_DAY = "50"
GRADER_CHAT_MESSAGES_PER_DAY = "10000"
GRADER_CHAT_MAX_INPUT_CHARACTERS = "500"
GRADER_CHAT_MAX_REPLY_TOKENS = "600"
GRADER_CHAT_EFFORT = "low"
GRADER_CHAT_BOOKLET_VERSION = "3"
GRADER_CHAT_ALERT_EVERY = "500"

# ── Grader kill switches (ISO-8601 UTC instants; docs/AUDIT-AUTH.md → Kill switches) ──
# Runs that completed, or never completed and started, before GRADER_RUNS_VALID_FROM no longer count:
# their session is refused grader_run_revoked, and the exchange (runsValidFrom) and every chat reply
# (graderChat.runsValidFrom) report the instant so the extension drops a cached run older than it.
# Setting it to now and deploying invalidates every run so far. It restores no attempt or message.
GRADER_RUNS_VALID_FROM = "2026-01-01T00:00:00Z"
# Extension builds made before GRADER_EXTENSION_BUILT_AFTER, by the X-LimeSpot-Extension-Built-At
# header they send, are refused extension_update_required at exchange and on every Grader call; the
# exchange reports it as extensionBuiltAfter. A build that sends no such header is read as made at
# 2026-10-03T00:00:00Z.
GRADER_EXTENSION_BUILT_AFTER = "2026-01-01T00:00:00Z"

# ── Logging ──
# Logging is level-routed entirely by configuration. Production sends durable QC
# telemetry plus failures to private Seq and emits no Worker console output.
LOG_TARGETS_TRACE = "ignore"
LOG_TARGETS_DEBUG = "ignore"
LOG_TARGETS_INFO = "seq"
LOG_TARGETS_WARN = "seq"
LOG_TARGETS_ERROR = "seq"
LOG_TARGETS_FATAL = "seq"
LOG_SEQ_INGEST_URL = "https://log.limespot.net/ingest/clef"

# Bundle system-prompt .md files as raw text at build time.
# Workers have no runtime filesystem, so `import x from './prompts/placement.md'`
# (and nested multi-file prompts like `./prompts/image-selection/prompt.md`)
# must resolve to the file's string contents during esbuild. The `**/*.md` glob
# matches prompt files at any depth, so both single-file and multi-file prompts
# under src/prompts/ are bundled. This Text rule makes that import return the
# raw markdown. vitest mirrors it with an inline Vite plugin in vitest.config.ts
# (same import specifier, no `?raw` suffix).
[[rules]]
type = "Text"
globs = ["**/*.md"]
fallthrough = true

# Metadata-only best-effort file dedup: route-scoped content hashes reuse direct
# provider uploads. Public reference correctness uses sealed tokens, not KV's
# eventual consistency. Kimi's separate R2 binding stores encrypted evidence bytes.
[[kv_namespaces]]
binding = "FILES_KV"
id = "eb048ab9979f46ce93d8b0dfcdb9d58f"
preview_id = "b524e2d6d53d482ead49f7ea60881dbd"

[[r2_buckets]]
binding = "INLINE_EVIDENCE_R2"
bucket_name = "app-ai-inline-evidence"
preview_bucket_name = "app-ai-inline-evidence-preview"

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AUDIT_SESSIONS"
class_name = "AuditSessionAuthority"

# Applied migrations are an append-only ledger: Cloudflare matches the deployed
# script's recorded tag against this list, so an already-applied entry keeps the
# tag and the class name it was applied under, verbatim and forever. The class is
# named AuditSessionAuthority today; the entry below records that it was created
# as DemoSessionAuthority, and the rename entry after it carries every existing
# instance's storage — the per-lead completed-attempt ledger included — onto the
# new class. Editing either entry orphans that storage irrecoverably.
[[migrations]]
tag = "demo-sessions-v1"
new_sqlite_classes = ["DemoSessionAuthority"]

[[migrations]]
tag = "audit-sessions-v2"
renamed_classes = [{ from = "DemoSessionAuthority", to = "AuditSessionAuthority" }]
